name: YouTube Data Collector
on:
  schedule:
    - cron: '30 23,5,11,17 * * *'  # 00:00,06:00,12:00,18:00 IST (UTC adjusted)
  workflow_dispatch:  # Manual "Run workflow" button

jobs:
  collect:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        block: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run collector
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: python data_collector.py --schedule_block ${{ matrix.block }}

    - name: Upload CSVs
      uses: actions/upload-artifact@v4
      with:
        name: videos_block_${{ matrix.block }}
        path: data/*.csv
        retention-days: 7
